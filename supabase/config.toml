# Background communication cron handlers authenticate internally with x-cron-secret.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-ack-watchdog]
verify_jwt = false

[functions.split-reminders-dispatch-v2]
verify_jwt = false

[functions.agent-proactive-tick]
verify_jwt = false

[functions.anticipation-tick]
# Internal cron calls authenticate in the handler with x-cron-secret.
verify_jwt = false

[functions.insights-generate]
# Cron calls authenticate inside the handler with x-cron-secret. Keeping the
# gateway JWT check enabled makes valid internal cron calls fail before the
# function can validate that secret.
verify_jwt = false

[functions.financial-reports-generate]
# Weekly/monthly cron calls also authenticate inside the handler with
# x-cron-secret. User-triggered calls remain protected by the handler JWT check.
verify_jwt = false

[functions.user-data-export]
verify_jwt = true

[functions.admin-process-deletion]
verify_jwt = true

[functions.agent-run]
verify_jwt = true

[functions.whatsapp-send]
# Worker interno: o gateway não pode barrar antes do handler. O dispatcher SQL
# (whatsapp_send_dispatch_tick) chama esta função com x-cron-secret e não tem
# como assinar um JWT, o que devolvia 401 e travava a fila para 100% dos
# usuários. A autorização é validada NO CÓDIGO: service role, segredo de cron
# ou JWT de admin — requisição anônima continua recebendo 401.
verify_jwt = false

[functions.whatsapp-session]
verify_jwt = true

[functions.whatsapp-official-number]
verify_jwt = true

[functions.admin-bootstrap]
verify_jwt = false

[functions.assistant-ingest-document]
verify_jwt = true

[functions.assistant-review-actions]
verify_jwt = true

[functions.documents-cleanup]
verify_jwt = false

[functions.nino-intelligence-tick]
verify_jwt = false

[functions.category-engine]
verify_jwt = false

[functions.home-snapshot]
# A função valida o JWT em código (`auth.getUser`) e também aceita a chamada
# interna do worker de materialização via `x-cron-secret`. O gate do gateway
# barrava essa chamada interna com "Missing authorization header".
verify_jwt = false

[functions.finance-current-snapshot-worker]
verify_jwt = false

[functions.finance-facts-worker]
# Internal cron calls authenticate in the handler with x-cron-secret.
verify_jwt = false
