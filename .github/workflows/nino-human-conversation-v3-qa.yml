name: Nino Human Conversation V3 QA

on:
  pull_request:
    paths:
      - 'scripts/nino_human_conversation_v3_qa.ts'
      - 'scripts/nino_debt_conversation_v3_qa.ts'
      - '.github/workflows/nino-human-conversation-v3-qa.yml'

permissions:
  contents: read

env:
  NINO_AI_PROVIDER: groq
  NINO_AI_MODEL: openai/gpt-oss-120b
  NINO_AI_FAST_MODEL: openai/gpt-oss-20b

jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run production-like debt conversation
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: deno run --allow-env --allow-net scripts/nino_debt_conversation_v3_qa.ts
