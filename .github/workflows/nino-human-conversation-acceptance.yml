name: Nino Human Conversation Acceptance
on:
  pull_request:
    paths:
      - 'scripts/nino_human_conversation_acceptance.ts'
      - '.github/workflows/nino-human-conversation-acceptance.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Human-like multi-turn conversation against production semantic authority
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NINO_AI_PROVIDER: groq
          NINO_AI_FAST_MODEL: openai/gpt-oss-20b
          NINO_AI_MODEL: openai/gpt-oss-120b
          NINO_SEMANTIC_FAST_MODEL: openai/gpt-oss-20b
          NINO_SEMANTIC_DEEP_MODEL: openai/gpt-oss-120b
        run: deno run --allow-env --allow-net scripts/nino_human_conversation_acceptance.ts
