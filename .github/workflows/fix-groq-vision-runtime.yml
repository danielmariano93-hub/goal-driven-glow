name: Fix Groq Vision Runtime

on:
  push:
    branches:
      - fix/groq-vision-model-20260917

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/groq-vision-model-20260917
          fetch-depth: 0

      - name: Wire runtime vision model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/assistant-ingest-document/index.ts')
          s = p.read_text()
          old = '''async function resolveConfiguredModel(sb: ReturnType<typeof createClient>, task: "vision" | "semantic_classification" | "document_text"): Promise<string> {
            const { data } = await sb.from("ai_model_routes")
              .select("primary_model")
              .eq("task", task)
              .eq("active", true)
              .maybeSingle();
            return String(data?.primary_model ?? DEFAULT_MODEL);
          }'''
          new = '''async function resolveConfiguredModel(sb: ReturnType<typeof createClient>, task: "vision" | "semantic_classification" | "document_text"): Promise<string> {
            // Vision is provider-specific: prefer the model explicitly validated and
            // deployed with the Groq runtime instead of a stale DB route from the old gateway.
            if (task === "vision") {
              const configuredVision = String(Deno.env.get("NINO_AI_VISION_MODEL") ?? "").trim();
              if (configuredVision) return configuredVision;
            }
            const { data } = await sb.from("ai_model_routes")
              .select("primary_model")
              .eq("task", task)
              .eq("active", true)
              .maybeSingle();
            return String(data?.primary_model ?? DEFAULT_MODEL);
          }'''
          if old not in s:
              raise SystemExit('resolveConfiguredModel block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          grep -q 'NINO_AI_VISION_MODEL' supabase/functions/assistant-ingest-document/index.ts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate provider regressions
        run: npx vitest run src/test/nino-ai-provider-independence.test.ts src/test/nino-ai-provider-shadow-v1.test.ts

      - name: Production build
        run: npm run build

      - name: Commit runtime fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/assistant-ingest-document/index.ts
          git commit -m 'fix(ai): use configured Groq vision model [skip ci]'
          git push origin HEAD:fix/groq-vision-model-20260917
