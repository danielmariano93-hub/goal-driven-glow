          new = 'const SYSTEM = `Você é o Semantic Interpreter V3 do Nino.\nIDENTIDADE CANÔNICA: Nino é ${NINO_IDENTITY.what} do ${NINO_IDENTITY.product}; propósito: ${NINO_IDENTITY.purpose}.\nSua única responsabilidade é transformar UMA mensagem em UMA interpretação semântica canônica estruturada.'
          assert old in s, 'V3 system anchor missing'
          s = s.replace(old, new, 1)
          old = '''14. canonical_request deve preservar o significado completo sem inventar dados ou datas resolvidas.\n\nA saída deve ser exclusivamente emit_nino_turn_spec_v3.`;'''
          new = '''14. canonical_request deve preservar o significado completo sem inventar dados ou datas resolvidas.\n15. "Quanto gasto por mês com X?", sem período histórico explícito, é hábito/típico: financial_query expense_amount, operation=value, group_by=[], periods=[], filtro X. NUNCA peça esclarecimento só por faltar período.\n16. "Quanto gastei ... por mês nos últimos N meses?" é série histórica factual: financial_query expense_amount, operation=trend, group_by=[month], periods=["últimos N meses"].\n17. "mês a mês", "mês por mês", "em cada mês", "evolução mensal" e equivalentes significam série histórica: operation=trend e group_by=[month], preservando filtros e período. Não use sum/breakdown para esse formato.\n18. Em financial_write use SOMENTE estas actions de domínio: ${ACTION_KINDS.join(", ")}. "Registre um gasto..." = transaction.create. Não invente nomes de tools/functions.\n19. Quando o usuário disser categoria e estabelecimento em qualquer ordem, preserve ambos como filtros independentes; o nome do merchant nunca inclui a categoria.\n20. direct_reply de conversation deve respeitar a identidade canônica do Nino e nunca citar arquitetura, modelo ou provedor.\n\nA saída deve ser exclusivamente emit_nino_turn_spec_v3.`;'''
          assert old in s, 'V3 prompt tail anchor missing'
          s = s.replace(old, new, 1)
          s = s.replace('strict semantic interpreter (shadow-ready, not routed yet)', 'strict semantic interpreter (production-authority ready)', 1)
          p.write_text(s, encoding='utf-8')

          # Deterministic invariant: historical month buckets have one canonical semantic
          # representation. Wrong-but-valid LLM shapes fail closed/circuit-break instead
          # of reaching a different engine.
          p = root / 'supabase/functions/_shared/agent/v3/SemanticInvariantsV3.ts'
          s = p.read_text(encoding='utf-8')
          anchor = 'function legacySourceInAuthoritativeTurnViolations(turn: TurnSpecV3, allowLegacySource: boolean): string[] {'
          assert anchor in s
          fn = r'''function canonicalMonthlySeriesViolations(turn: TurnSpecV3): string[] {
  if (turn.kind !== "task") return [];
  const violations: string[] = [];
  for (const [index, task] of turn.tasks.entries()) {
    if (task.kind !== "financial_query") continue;
    const monthly = task.group_by.length === 1 && task.group_by[0] === "month" && task.periods.length > 0;
    if (monthly && (task.operation === "sum" || task.operation === "breakdown")) {
      violations.push(`task_${index}_monthly_series_requires_trend`);
    }
  }
  return violations;
}

'''
          s = s.replace(anchor, fn + anchor, 1)
          old = '    ...suspiciousTemporalEntityReferenceViolations(turn),\n    ...legacySourceInAuthoritativeTurnViolations(turn, options.allowLegacySource === true),'
          new = '    ...suspiciousTemporalEntityReferenceViolations(turn),\n    ...canonicalMonthlySeriesViolations(turn),\n    ...legacySourceInAuthoritativeTurnViolations(turn, options.allowLegacySource === true),'
