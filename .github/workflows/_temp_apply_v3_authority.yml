          s = s.replace(anchor, 'import { ACTION_KINDS } from "../core/ActionIR.ts";\nimport { NINO_IDENTITY } from "../core/Conversational.ts";\n' + anchor, 1)
          old = '    action: { type: "string" },'
          new = '    action: { type: "string", enum: [...ACTION_KINDS] },'
