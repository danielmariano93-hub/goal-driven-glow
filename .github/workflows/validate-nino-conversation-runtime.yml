name: Validate Nino Conversation Runtime

on:
  push:
    branches:
      - fix/nino-conversation-runtime-20260917

permissions:
  contents: read

env:
  NINO_AI_PROVIDER: groq
  NINO_AI_MODEL: openai/gpt-oss-120b
  NINO_AI_FAST_MODEL: openai/gpt-oss-20b

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate agent dependency graph
        run: npm run check:agent-dependents

      - name: Run conversation and semantic regressions
        run: >-
          npx vitest run
          src/test/nino-confirmation-fastpath.test.ts
          src/test/nino-conversation-authority-p0.test.ts
          src/test/nino-conversation-brain-v1.test.ts
          src/test/nino-action-slot-resolver.test.ts
          src/test/nino-advisory-bridge.test.ts
          src/test/nino-conversation-v2-golden-scenarios.test.ts
          src/test/nino-conversation-shadow-v1.test.ts
          src/test/nino-ai-provider-independence.test.ts
          src/test/nino-ai-provider-shadow-v1.test.ts
          src/test/nino-semantic-ir-v2.test.ts
          src/test/nino-semantic-ir-v3.test.ts
          src/test/nino-semantic-pipeline.test.ts
          src/test/nino-intelligence-core.test.ts
          src/test/nino-brain-user-context.test.ts
          src/test/nino-conversation-memory-safety.test.ts
          src/test/nino-response-preference-learning.test.ts
          src/test/continuation-contract.test.ts

      - name: Production build
        run: npm run build

      - name: Groq structured-call compatibility
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || (echo 'Missing GROQ_API_KEY' && exit 1)
          for smoke_model in "$NINO_AI_MODEL" "$NINO_AI_FAST_MODEL"; do
            SMOKE_MODEL="$smoke_model" node <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('/tmp/request.json', JSON.stringify({
            model: process.env.SMOKE_MODEL,
            messages: [
              { role: 'system', content: 'Return data only through emit_smoke.' },
              { role: 'user', content: 'Emit ok=true.' },
            ],
            tools: [{
              type: 'function',
              function: {
                name: 'emit_smoke',
                description: 'Structured tool-call smoke test.',
                parameters: {
                  type: 'object',
                  additionalProperties: false,
                  properties: { ok: { type: 'boolean' } },
                  required: ['ok'],
                },
              },
            }],
            tool_choice: { type: 'function', function: { name: 'emit_smoke' } },
            temperature: 0,
            reasoning_effort: 'low',
          }));
          NODE
            code="$(curl --silent --show-error --output /tmp/response.json --write-out '%{http_code}'               --header "Authorization: Bearer $GROQ_API_KEY"               --header 'Content-Type: application/json'               --data @/tmp/request.json               https://api.groq.com/openai/v1/chat/completions)"
            test "$code" = "200" || (echo "Groq returned HTTP $code for $smoke_model"; cat /tmp/response.json; exit 1)
            node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/response.json', 'utf8'));
          const call = body?.choices?.[0]?.message?.tool_calls?.find(x => x?.function?.name === 'emit_smoke');
          if (!call?.function?.arguments) throw new Error('missing emit_smoke tool call');
          if (JSON.parse(call.function.arguments).ok !== true) throw new Error('invalid emit_smoke payload');
          NODE
          done

          echo 'Running real Conversation Brain provider smoke.'
          deno run --allow-env --allow-net scripts/nino_conversation_provider_smoke.ts
