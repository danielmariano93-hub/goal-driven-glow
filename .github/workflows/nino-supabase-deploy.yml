name: Nino Direct Supabase Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/nino-supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to authorize a manual production deployment'
        required: false
        default: 'DEPLOY'
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: amjanjlvsatubxdreyep
  NINO_AI_PROVIDER: groq
  NINO_AI_MODEL: openai/gpt-oss-120b
  NINO_AI_FAST_MODEL: openai/gpt-oss-20b
  NINO_AI_VISION_MODEL: qwen/qwen3.8-27b
  NINO_AI_TRANSCRIPTION_MODEL: whisper-large-v3-turbo
  NINO_SHADOW_AI_PROVIDER: groq
  NINO_SHADOW_AI_MODEL: openai/gpt-oss-120b

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate atomic agent dependents
        run: npm run check:agent-dependents

      - name: Run deploy contract tests
        run: npm run test:deploy-contract

      - name: Run Nino conversation regressions
        run: >-
          npx vitest run
          src/test/nino-confirmation-fastpath.test.ts
          src/test/nino-conversation-authority-p0.test.ts
          src/test/nino-conversation-brain-v1.test.ts
          src/test/nino-action-slot-resolver.test.ts
          src/test/nino-conversation-v2-golden-scenarios.test.ts
          src/test/nino-conversation-shadow-v1.test.ts
          src/test/nino-ai-provider-independence.test.ts
          src/test/nino-ai-provider-shadow-v1.test.ts
          src/test/nino-semantic-ir-v2.test.ts
          src/test/nino-semantic-ir-v3.test.ts
          src/test/nino-semantic-pipeline.test.ts
          src/test/nino-intelligence-core.test.ts
          src/test/nino-brain-user-context.test.ts
          src/test/nino-conversation-memory-safety.test.ts
          src/test/nino-response-preference-learning.test.ts
          src/test/continuation-contract.test.ts

      - name: Production build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'Missing SUPABASE_PROJECT_REF' && exit 1)

      - name: Configure Supabase Auth production URLs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          auth_url="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          status="$(curl --silent --show-error --output /tmp/auth-before.json --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$auth_url")"
          test "$status" = "200" || (echo "Supabase Auth config GET returned HTTP $status" && exit 1)

          node <<'NODE'
          const fs = require('fs');
          const current = JSON.parse(fs.readFileSync('/tmp/auth-before.json', 'utf8'));
          const existing = String(current.uri_allow_list || '')
            .split(',').map(v => v.trim()).filter(Boolean)
            .filter(v => !/lovable\.app|lovableproject\.com|lovable\.dev/i.test(v));
          const required = [
            'https://meunino.com.br',
            'https://meunino.com.br/**',
            'https://www.meunino.com.br',
            'https://www.meunino.com.br/**',
          ];
          const payload = {
            site_url: 'https://meunino.com.br',
            uri_allow_list: [...new Set([...existing, ...required])].join(','),
          };
          fs.writeFileSync('/tmp/auth-patch.json', JSON.stringify(payload));
          NODE

          status="$(curl --silent --show-error --output /tmp/auth-after.json --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data @/tmp/auth-patch.json "$auth_url")"
          test "$status" = "200" || (echo "Supabase Auth config PATCH returned HTTP $status" && exit 1)

          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/auth-after.json', 'utf8'));
          if (body.site_url !== 'https://meunino.com.br') throw new Error(`Unexpected site_url: ${body.site_url}`);
          const allow = String(body.uri_allow_list || '');
          for (const wanted of ['https://meunino.com.br', 'https://www.meunino.com.br']) {
            if (!allow.includes(wanted)) throw new Error(`Missing redirect origin: ${wanted}`);
          }
          if (/lovable\.app|lovableproject\.com|lovable\.dev/i.test(allow)) {
            throw new Error('Legacy Lovable redirect URL still present');
          }
          console.log('Supabase Auth Site URL and redirect allow-list verified for meunino.com.br.');
          NODE
          rm -f /tmp/auth-before.json /tmp/auth-patch.json /tmp/auth-after.json

      - name: Validate Groq credential and required models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || (echo 'Missing GROQ_API_KEY repository secret' && exit 1)

          models_status="$(curl --silent --show-error \
            --output /tmp/groq-models.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GROQ_API_KEY" \
            https://api.groq.com/openai/v1/models)"
          test "$models_status" = "200" || (echo "Groq models endpoint returned HTTP $models_status" && exit 1)

          node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/groq-models.json', 'utf8'));
          const available = new Set((Array.isArray(body.data) ? body.data : []).map(m => m?.id).filter(Boolean));
          const wanted = [
            process.env.NINO_AI_MODEL,
            process.env.NINO_AI_FAST_MODEL,
            process.env.NINO_AI_VISION_MODEL,
            process.env.NINO_AI_TRANSCRIPTION_MODEL,
          ];
          const missing = wanted.filter(model => !available.has(model));
          if (missing.length) {
            console.error(`Required Groq models unavailable: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Groq credential valid; required models available: ${wanted.join(', ')}`);
          NODE

          # Exercise the exact transport used by ConversationBrain,
          # SemanticCompiler and HumanUnderstanding. A plain text smoke test is
          # insufficient: the 17/09 incident passed CI while forced tool calls
          # failed at runtime.
          for smoke_model in "$NINO_AI_MODEL" "$NINO_AI_FAST_MODEL"; do
            SMOKE_MODEL="$smoke_model" node <<'NODE'
          const fs = require('fs');
          const body = {
            model: process.env.SMOKE_MODEL,
            messages: [
              { role: 'system', content: 'Return data only through emit_smoke.' },
              { role: 'user', content: 'Emit ok=true.' },
            ],
            tools: [{
              type: 'function',
              function: {
                name: 'emit_smoke',
                description: 'Runtime structured-call compatibility probe.',
                parameters: {
                  type: 'object',
                  additionalProperties: false,
                  properties: { ok: { type: 'boolean' } },
                  required: ['ok'],
                },
              },
            }],
            tool_choice: { type: 'function', function: { name: 'emit_smoke' } },
            temperature: 0,
            reasoning_effort: 'low',
          };
          fs.writeFileSync('/tmp/groq-structured-request.json', JSON.stringify(body));
          NODE

            structured_status="$(curl --silent --show-error \
              --output /tmp/groq-structured-response.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GROQ_API_KEY" \
              --header 'Content-Type: application/json' \
              --data @/tmp/groq-structured-request.json \
              https://api.groq.com/openai/v1/chat/completions)"
            test "$structured_status" = "200" || (echo "Groq structured Chat Completions returned HTTP $structured_status for $smoke_model" && cat /tmp/groq-structured-response.json && exit 1)

            node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/groq-structured-response.json', 'utf8'));
          const call = body?.choices?.[0]?.message?.tool_calls?.find(
            item => item?.type === 'function' && item?.function?.name === 'emit_smoke'
          );
          if (!call?.function?.arguments) throw new Error('Structured tool call missing');
          const args = JSON.parse(call.function.arguments);
          if (args.ok !== true) throw new Error('Structured tool arguments invalid');
          NODE
            echo "Groq structured function-call smoke passed for $smoke_model."
          done
          rm -f /tmp/groq-models.json /tmp/groq-structured-request.json /tmp/groq-structured-response.json

      - name: Sync Groq runtime configuration to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            GROQ_API_KEY="$GROQ_API_KEY" \
            GROQ_BASE_URL="https://api.groq.com/openai/v1" \
            NINO_AI_PROVIDER="$NINO_AI_PROVIDER" \
            NINO_AI_MODEL="$NINO_AI_MODEL" \
            NINO_AI_FAST_MODEL="$NINO_AI_FAST_MODEL" \
            NINO_AI_VISION_MODEL="$NINO_AI_VISION_MODEL" \
            NINO_AI_TRANSCRIPTION_MODEL="$NINO_AI_TRANSCRIPTION_MODEL" \
            NINO_SHADOW_AI_PROVIDER="$NINO_SHADOW_AI_PROVIDER" \
            NINO_SHADOW_AI_MODEL="$NINO_SHADOW_AI_MODEL"
          echo 'Groq runtime configuration synced to Supabase.'

      - name: Remove legacy Lovable AI secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -q 'LOVABLE_API_KEY'; then
            supabase secrets unset LOVABLE_API_KEY --project-ref "$SUPABASE_PROJECT_REF"
            echo 'Legacy LOVABLE_API_KEY removed from Supabase Edge secrets.'
          else
            echo 'Legacy LOVABLE_API_KEY already absent.'
          fi

      - name: Sync Vault cron credential to Edge runtime
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          query="select decrypted_secret as value from vault.decrypted_secrets where name in ('INTERNAL_CRON_SECRET','meunino_cron_secret','nocontrole_cron_secret') order by case name when 'INTERNAL_CRON_SECRET' then 0 when 'meunino_cron_secret' then 1 else 2 end, created_at desc limit 1"
          payload="$(node -e 'process.stdout.write(JSON.stringify({query: process.argv[1]}))' "$query")"
          http_status="$(curl --silent --show-error \
            --output /tmp/cron-secret.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          case "$http_status" in 200|201) ;; *) echo "Supabase database query returned HTTP $http_status"; rm -f /tmp/cron-secret.json; exit 1 ;; esac

          cron_secret="$(node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/cron-secret.json", "utf8"));
            const rows = Array.isArray(body) ? body : (Array.isArray(body.result) ? body.result : (Array.isArray(body.data) ? body.data : []));
            const value = rows?.[0]?.value;
            if (typeof value !== "string" || value.length < 16) process.exit(2);
            process.stdout.write(value);
          ')" || (echo 'No valid internal cron secret found in Supabase Vault' && rm -f /tmp/cron-secret.json && exit 1)

          echo "::add-mask::$cron_secret"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            INTERNAL_CRON_SECRET="$cron_secret" \
            CRON_SECRET="$cron_secret"
          unset cron_secret
          rm -f /tmp/cron-secret.json
          echo 'Internal cron credential synchronized from Vault to Edge runtime.'

      - name: Deploy complete application Edge Function backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          deployed=0
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            fn="$(basename "$dir")"
            case "$fn" in
              _shared)
                continue
                ;;
              mcp)
                # Generated external MCP bundle is not part of the web/app/WhatsApp runtime.
                # It remains excluded until it is regenerated against the owned stack.
                echo "Skipping generated external MCP endpoint: $fn"
                continue
                ;;
            esac
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            deployed=$((deployed + 1))
          done
          echo "deployed_functions=$deployed" >> "$GITHUB_ENV"

      - name: Verify deployed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deployment receipt
        run: |
          echo "revision=${GITHUB_SHA}"
          echo "project_ref=${SUPABASE_PROJECT_REF}"
          echo "scope=application_edge_functions"
          echo "deployed_functions=${deployed_functions:-unknown}"
          echo "excluded_external_integration=mcp"
          echo "primary_provider=$NINO_AI_PROVIDER"
          echo "primary_model=$NINO_AI_MODEL"
          echo "fast_model=$NINO_AI_FAST_MODEL"
          echo "vision_model=$NINO_AI_VISION_MODEL"
          echo "transcription_model=$NINO_AI_TRANSCRIPTION_MODEL"
          echo "shadow_provider=$NINO_SHADOW_AI_PROVIDER"
          echo "shadow_model=$NINO_SHADOW_AI_MODEL"
