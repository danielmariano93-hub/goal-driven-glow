name: Nino Direct Supabase Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/nino-supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to authorize a manual production deployment'
        required: false
        default: 'DEPLOY'
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: amjanjlvsatubxdreyep
  NINO_AI_PROVIDER: groq
  NINO_AI_MODEL: openai/gpt-oss-120b
  NINO_SHADOW_AI_PROVIDER: groq
  NINO_SHADOW_AI_MODEL: openai/gpt-oss-120b

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate atomic agent dependents
        run: npm run check:agent-dependents

      - name: Run deploy contract tests
        run: npm run test:deploy-contract

      - name: Run Nino conversation regressions
        run: >-
          npx vitest run
          src/test/nino-confirmation-fastpath.test.ts
          src/test/nino-conversation-authority-p0.test.ts
          src/test/nino-conversation-brain-v1.test.ts
          src/test/nino-action-slot-resolver.test.ts
          src/test/nino-conversation-v2-golden-scenarios.test.ts
          src/test/nino-conversation-shadow-v1.test.ts
          src/test/nino-ai-provider-independence.test.ts
          src/test/nino-ai-provider-shadow-v1.test.ts

      - name: Production build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'Missing SUPABASE_PROJECT_REF' && exit 1)

      - name: Validate Groq credential and runtime model
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GROQ_API_KEY" || (echo 'Missing GROQ_API_KEY repository secret' && exit 1)

          models_status="$(curl --silent --show-error \
            --output /tmp/groq-models.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GROQ_API_KEY" \
            https://api.groq.com/openai/v1/models)"
          test "$models_status" = "200" || (echo "Groq models endpoint returned HTTP $models_status" && exit 1)

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/groq-models.json", "utf8"));
            const wanted = process.env.NINO_AI_MODEL;
            const found = Array.isArray(body.data) && body.data.some((m) => m && m.id === wanted);
            if (!found) {
              console.error(`Configured Groq runtime model is unavailable: ${wanted}`);
              process.exit(1);
            }
            console.log(`Groq credential valid; model available: ${wanted}`);
          '

          responses_status="$(curl --silent --show-error \
            --output /tmp/groq-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GROQ_API_KEY" \
            --header 'Content-Type: application/json' \
            --data "{\"model\":\"$NINO_AI_MODEL\",\"input\":\"Return exactly the word ok.\",\"max_output_tokens\":8}" \
            https://api.groq.com/openai/v1/responses)"
          test "$responses_status" = "200" || (echo "Groq Responses endpoint returned HTTP $responses_status" && exit 1)
          echo 'Groq Responses compatibility smoke test passed.'
          rm -f /tmp/groq-models.json /tmp/groq-response.json

      - name: Sync Groq runtime configuration to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            GROQ_API_KEY="$GROQ_API_KEY" \
            GROQ_BASE_URL="https://api.groq.com/openai/v1" \
            NINO_AI_PROVIDER="$NINO_AI_PROVIDER" \
            NINO_AI_MODEL="$NINO_AI_MODEL" \
            NINO_SHADOW_AI_PROVIDER="$NINO_SHADOW_AI_PROVIDER" \
            NINO_SHADOW_AI_MODEL="$NINO_SHADOW_AI_MODEL"
          echo 'Groq primary and shadow runtime configuration synced to Supabase.'

      - name: Sync Vault cron credential to Edge runtime
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          query="select decrypted_secret as value from vault.decrypted_secrets where name in ('INTERNAL_CRON_SECRET','meunino_cron_secret','nocontrole_cron_secret') order by case name when 'INTERNAL_CRON_SECRET' then 0 when 'meunino_cron_secret' then 1 else 2 end, created_at desc limit 1"
          payload="$(node -e 'process.stdout.write(JSON.stringify({query: process.argv[1]}))' "$query")"
          http_status="$(curl --silent --show-error \
            --output /tmp/cron-secret.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query")"
          case "$http_status" in 200|201) ;; *) echo "Supabase database query returned HTTP $http_status"; rm -f /tmp/cron-secret.json; exit 1 ;; esac

          cron_secret="$(node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/cron-secret.json", "utf8"));
            const rows = Array.isArray(body) ? body : (Array.isArray(body.result) ? body.result : (Array.isArray(body.data) ? body.data : []));
            const value = rows?.[0]?.value;
            if (typeof value !== "string" || value.length < 16) process.exit(2);
            process.stdout.write(value);
          ')" || (echo 'No valid internal cron secret found in Supabase Vault' && rm -f /tmp/cron-secret.json && exit 1)

          echo "::add-mask::$cron_secret"
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            INTERNAL_CRON_SECRET="$cron_secret" \
            CRON_SECRET="$cron_secret"
          unset cron_secret
          rm -f /tmp/cron-secret.json
          echo 'Internal cron credential synchronized from Vault to Edge runtime.'

      - name: Deploy complete application Edge Function backend
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          deployed=0
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            fn="$(basename "$dir")"
            case "$fn" in
              _shared)
                continue
                ;;
              mcp)
                # Generated Lovable MCP bundle is an external integration endpoint,
                # not part of the web/app/WhatsApp runtime. Its generated artifact
                # currently exceeds the Supabase Edge upload limit and still carries
                # the legacy project's OAuth issuer, so it must be migrated/regenerated
                # separately rather than blocking the application cutover.
                echo "Skipping generated external MCP endpoint: $fn"
                continue
                ;;
            esac
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
            deployed=$((deployed + 1))
          done
          echo "deployed_functions=$deployed" >> "$GITHUB_ENV"

      - name: Verify deployed functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deployment receipt
        run: |
          echo "revision=${GITHUB_SHA}"
          echo "project_ref=${SUPABASE_PROJECT_REF}"
          echo "scope=application_edge_functions"
          echo "deployed_functions=${deployed_functions:-unknown}"
          echo "excluded_external_integration=mcp"
          echo "primary_provider=$NINO_AI_PROVIDER"
          echo "primary_model=$NINO_AI_MODEL"
          echo "shadow_provider=$NINO_SHADOW_AI_PROVIDER"
          echo "shadow_model=$NINO_SHADOW_AI_MODEL"
