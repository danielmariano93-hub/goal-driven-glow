name: Apply Nino Monthly Series v1

on:
  push:
    branches:
      - feat/nino-monthly-series-vercel-gate-20260926
    paths:
      - 'scripts/apply-nino-monthly-series-20260926.mjs'
      - '.github/workflows/apply-nino-monthly-series-20260926.yml'

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/nino-monthly-series-vercel-gate-20260926
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Syntax-check one-shot patcher
        run: node --check scripts/apply-nino-monthly-series-20260926.mjs

      - name: Apply reviewed runtime patch
        run: node scripts/apply-nino-monthly-series-20260926.mjs

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run focused monthly-series regression
        run: npx vitest run src/test/nino-monthly-series-v1.test.ts src/test/nino-merchant-period-runtime.test.ts src/test/nino-semantic-authority-pipeline.test.ts

      - name: Validate production build
        run: npm run build

      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply-nino-monthly-series-20260926.mjs
          rm .github/workflows/apply-nino-monthly-series-20260926.yml

      - name: Guard against unrelated generated changes
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(supabase/functions/_shared/agent/core/(FinancialIRv3|IRCapabilityAdapter|SemanticTurnPipeline|AgentCore|AgentCoreV2|RuntimeContract)\.ts|supabase/functions/_shared/analytics/periodResolver\.ts|scripts/apply-nino-monthly-series-20260926\.mjs|\.github/workflows/apply-nino-monthly-series-20260926\.yml)$'
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected files changed during patch/build:'
            echo "$unexpected"
            exit 1
          fi

      - name: Commit applied patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(nino): monthly category and merchant series with deploy gate'
          git push origin HEAD:feat/nino-monthly-series-vercel-gate-20260926
