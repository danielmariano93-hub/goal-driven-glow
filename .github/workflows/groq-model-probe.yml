name: Groq Model Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/groq-model-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List accessible Groq models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail \
            --header "Authorization: Bearer $GROQ_API_KEY" \
            https://api.groq.com/openai/v1/models \
            | python3 -c 'import sys,json; data=json.load(sys.stdin); print("\n".join(sorted(m["id"] for m in data.get("data",[]) if m.get("id"))))'
