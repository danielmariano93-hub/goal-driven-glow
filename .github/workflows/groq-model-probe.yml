name: Finalize Groq Vision Model

on:
  push:
    branches: [main]
    paths: ['.github/workflows/groq-model-probe.yml']

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Switch to accessible Groq vision model and remove helper
        run: |
          set -euo pipefail
          sed -i 's#qwen/qwen3\.6-27b#qwen/qwen3.8-27b#g' .github/workflows/nino-supabase-deploy.yml
          git rm .github/workflows/groq-model-probe.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/nino-supabase-deploy.yml
          git commit -m 'fix(ai): use accessible Groq Qwen vision model [skip ci]'
          git push origin HEAD:main
