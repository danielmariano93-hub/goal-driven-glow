name: Nino Agent Run Hotfix

on:
  # Emergency execution is explicit. Ordinary pushes use the complete deploy
  # workflow; two concurrent deploy workflows previously left whatsapp-webhook
  # on .1 while agent-run alone reached .4.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type HOTFIX to redeploy every agent runtime consumer'
        required: true
        default: ''
        type: string

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: amjanjlvsatubxdreyep
  NINO_AI_PROVIDER: groq
  NINO_AI_MODEL: openai/gpt-oss-120b
  NINO_AI_FAST_MODEL: openai/gpt-oss-20b

jobs:
  hotfix:
    if: ${{ inputs.confirm == 'HOTFIX' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Reproduce comparison grounding regression
        run: |
          set -euo pipefail
          deno run --node-modules-dir=auto scripts/nino_comparison_grounding_smoke.ts
      - name: Reconfirm real Groq smoke
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail
          deno run --allow-env --allow-net scripts/nino_conversation_provider_smoke.ts
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Validate atomic agent dependents
        run: node scripts/check-agent-dependents.mjs
      - name: Deploy every agent runtime consumer from the exact revision
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t functions < <(sed -n 's/^- `\([^`]*\)`$/\1/p' supabase/functions/_shared/agent/DEPENDENTS.md)
          test "${#functions[@]}" -gt 0
          for fn in "${functions[@]}"; do
            echo "Deploying runtime consumer: $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
      - name: Receipt
        run: |
          echo "revision=${GITHUB_SHA}"
          echo "scope=all_agent_runtime_consumers"
          echo "comparison_grounding_smoke=passed"
          echo "provider_smoke=passed"
