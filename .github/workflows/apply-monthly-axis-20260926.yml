name: Apply Monthly Chart Axis 20260926

on:
  push:
    branches:
      - feat/nino-monthly-series-vercel-gate-20260926
    paths:
      - 'scripts/patch-monthly-axis-20260926.mjs'
      - '.github/workflows/apply-monthly-axis-20260926.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nino-monthly-series-vercel-gate-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply reviewed renderer patch
        run: node scripts/patch-monthly-axis-20260926.mjs
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Validate monthly labels and WhatsApp PNG renderer
        run: npx vitest run src/test/nino-monthly-series-v1.test.ts src/test/whatsapp-monthly-chart.test.ts src/test/nino-semantic-ontology.test.ts
      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/patch-monthly-axis-20260926.mjs
          rm .github/workflows/apply-monthly-axis-20260926.yml
      - name: Commit renderer patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(chart): render month-year labels in WhatsApp series'
          git push origin HEAD:feat/nino-monthly-series-vercel-gate-20260926
