name: Nino Production Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nino-production-deploy-once.yml'

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'deploy(nino): production rollout 2026-09-14' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate deploy contract
        run: npm run test:deploy-contract

      - name: Run Nino regressions
        run: >-
          npx vitest run
          src/test/nino-confirmation-fastpath.test.ts
          src/test/nino-conversation-authority-p0.test.ts
          src/test/nino-conversation-brain-v1.test.ts
          src/test/nino-action-slot-resolver.test.ts
          src/test/nino-conversation-v2-golden-scenarios.test.ts
          src/test/nino-conversation-shadow-v1.test.ts
          src/test/nino-ai-provider-independence.test.ts

      - name: Production build
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NINO_AI_MODEL: ${{ secrets.NINO_AI_MODEL }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'Missing SUPABASE_PROJECT_REF' && exit 1)
          test -n "$OPENAI_API_KEY" || (echo 'Missing OPENAI_API_KEY' && exit 1)
          test -n "$NINO_AI_MODEL" || (echo 'Missing NINO_AI_MODEL' && exit 1)

      - name: Configure Nino direct OpenAI provider
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NINO_AI_MODEL: ${{ secrets.NINO_AI_MODEL }}
        run: |
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            NINO_AI_PROVIDER="openai" \
            NINO_AI_MODEL="$NINO_AI_MODEL"

      - name: Deploy atomic Nino Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for fn in \
            whatsapp-webhook \
            agent-run \
            agent-chat \
            agent-proactive-tick \
            anticipation-tick \
            financial-reports-generate \
            shared-goal-notify-invite \
            split-reminders-dispatch-v2 \
            user-ai-preferences \
            nino-next-step
          do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deployment receipt
        run: |
          echo "revision=${GITHUB_SHA}"
          echo "project_ref=${SUPABASE_PROJECT_REF}"
          echo "provider=openai"
          echo "functions=10"
