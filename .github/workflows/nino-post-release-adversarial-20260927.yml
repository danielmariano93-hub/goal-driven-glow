name: Nino Post Release Adversarial 20260927

on:
  push:
    branches:
      - test/nino-post-release-adversarial-20260927

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NINO_AI_PROVIDER: groq
      NINO_AI_MODEL: openai/gpt-oss-120b
      NINO_AI_FAST_MODEL: openai/gpt-oss-20b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      NINO_TEST_PAUSE_MS: "20000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Prepare unresolved scenarios with quota-safe single attempts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/nino_post_release_adversarial_20260927.ts')
          s = p.read_text()
          selected = '[2,' + ','.join(str(i) for i in range(15, 49)) + ']'
          s = s.replace(
              'for (const scenario of scenarios) {',
              f'const selectedIds = new Set({selected});\nfor (const scenario of scenarios.filter((item) => selectedIds.has(item.id))) {{'
          )
          s = s.replace('attempt <= 3', 'attempt <= 1')
          s = s.replace('attempt === 3', 'attempt === 1')
          p.write_text(s)
          PY

      - name: Cool down provider quota window
        run: sleep 75

      - name: Run unresolved live 120B scenarios
        run: deno run --allow-env --allow-net scripts/nino_post_release_adversarial_20260927.ts
