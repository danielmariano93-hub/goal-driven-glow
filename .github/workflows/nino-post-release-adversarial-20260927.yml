name: Nino Post Release Adversarial 20260927

on:
  push:
    branches:
      - test/nino-post-release-adversarial-20260927

permissions:
  contents: read

jobs:
  adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NINO_AI_PROVIDER: groq
      NINO_AI_MODEL: openai/gpt-oss-120b
      NINO_AI_FAST_MODEL: openai/gpt-oss-20b
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      NINO_TEST_PAUSE_MS: "3500"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Re-run deterministic lifecycle and continuity guards
        run: |
          npx vitest run \
            src/test/nino-lifecycle-hardening-v3.test.ts \
            src/test/nino-confirmation-routing-hardening.test.ts \
            src/test/nino-ai-structured-retry.test.ts \
            src/test/agent-chart-routing.test.ts \
            src/test/nino-followup-comparison-regression.test.ts \
            src/test/nino-monthly-calendar-window-regression.test.ts

      - name: Run live 120B adversarial semantic battery
        run: deno run --allow-env --allow-net scripts/nino_post_release_adversarial_20260927.ts
