name: Cleanup Supabase Migration Functions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-supabase-migration-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: amjanjlvsatubxdreyep

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN' && exit 1)

      - name: Delete migration-only Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for fn in \
            nino-migration-bridge-temp \
            nino-auth-migration-temp \
            nino-source-migration-import-temp \
            migration-ingest \
            nino-storage-migrate-temp \
            nino-runtime-secret-check-temp
          do
            echo "Deleting migration-only function: $fn"
            supabase functions delete "$fn" --project-ref "$SUPABASE_PROJECT_REF" --yes || true
          done

      - name: Verify cleanup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          remaining="$(supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | grep -E 'nino-migration-bridge-temp|nino-auth-migration-temp|nino-source-migration-import-temp|migration-ingest|nino-storage-migrate-temp|nino-runtime-secret-check-temp' || true)"
          if [ -n "$remaining" ]; then
            echo 'Migration-only functions still present:'
            echo "$remaining"
            exit 1
          fi
          echo 'Migration-only Edge Functions removed.'
