name: Apply Nino AI Cutover

on:
  push:
    branches:
      - fix/nino-ai-cutover-20260917

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/nino-ai-cutover-20260917
          fetch-depth: 0

      - name: Apply provider cutover
        run: python3 scripts/nino_ai_cutover.py

      - name: Assert no Lovable AI runtime dependency
        run: |
          set -euo pipefail
          ! grep -R --line-number --include='*.ts' 'ai.gateway.lovable.dev' supabase/functions
          ! grep -R --line-number --include='*.ts' 'Deno.env.get("LOVABLE_API_KEY")' supabase/functions
          ! grep -R --line-number --include='*.ts' 'createLovableAiGatewayProvider' supabase/functions

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Run AI/provider regressions
        run: >-
          npx vitest run
          src/test/nino-ai-provider-independence.test.ts
          src/test/nino-ai-provider-shadow-v1.test.ts
          src/test/nino-conversation-brain-v1.test.ts
          src/test/nino-conversation-v2-golden-scenarios.test.ts

      - name: Production build
        run: npm run build

      - name: Remove one-shot migration files
        run: git rm scripts/nino_ai_cutover.py .github/workflows/apply-nino-ai-cutover.yml

      - name: Commit validated cutover
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(ai): finish Groq provider cutover [skip ci]'
          git push origin HEAD:fix/nino-ai-cutover-20260917
