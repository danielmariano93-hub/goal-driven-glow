name: Nino Runtime Import Migration

on:
  push:
    branches:
      - fix/nino-provider-independence-ci
    paths:
      - '.github/workflows/nino-runtime-import-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nino-provider-independence-ci
      - name: Move agent runtime imports off SDK gateway
        run: |
          set -euo pipefail
          sed -i 's#../../ai-gateway\.ts#../../ai-runtime.ts#g' supabase/functions/_shared/agent/core/ConversationBrain.ts
          sed -i 's#../../ai-gateway\.ts#../../ai-runtime.ts#g' supabase/functions/_shared/agent/core/SemanticCompiler.ts
          sed -i 's#../../ai-gateway\.ts#../../ai-runtime.ts#g' supabase/functions/_shared/agent/core/HumanUnderstanding.ts
          sed -i 's#../../ai-gateway\.ts#../../ai-runtime.ts#g' supabase/functions/_shared/agent/core/Conversational.ts
          sed -i 's#../../ai-gateway\.ts#../../ai-runtime.ts#g' supabase/functions/_shared/agent/narrative/NarrativeComposer.ts
          sed -i 's#../ai-gateway\.ts#../ai-runtime.ts#g' supabase/functions/_shared/agent/llm.ts
          git rm .github/workflows/nino-runtime-import-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/_shared/agent
          git commit -m 'refactor(nino): isolate provider runtime from SDK gateway'
          git push origin HEAD:fix/nino-provider-independence-ci
